# Prefer fdk-aac over FFmpeg's avdec_aac in every GStreamer app.
# Libation downloads Audible books as xHE-AAC (USAC), which FFmpeg only partly
# decodes: it drops packets ("Not yet implemented in FFmpeg") and lost 24% of a
# test book, heard as sped-up words. fdkaacdec decodes them completely, and
# plain AAC-LC/HE-AAC as well. By default it ranks 64 against avdec_aac's 256.
GST_PLUGIN_FEATURE_RANK=fdkaacdec:MAX
