# Hosts whose SSH connections go through the 1Password agent
# (private_dot_ssh/private_config.tmpl). Every other host keeps
# "IdentityAgent none"; see that template for why it is not "Host *".
# ~/.ssh/id_ed25519 is still offered for these hosts, so a host keeps working
# before its key is in 1Password.
onePasswordSSHHosts:
  - github.com
