# Managed by chezmoi — source: ~/.dotfiles/dot_local/share/plex/mpv.conf
#
# Plex HTPC re-reads this file before every playback. Only options listed as
# overridable in ~/.local/share/plex/mpv.conf.md actually take effect; `panscan`
# is one of them. (`aid`, `sid`, `volume` and friends are hard-overridden by the
# app and cannot be set here.)
#
# panscan=1.0 zooms until the frame fills the display, cropping the overflow and
# preserving the source aspect ratio — this is "zoom", not "stretch": geometry
# stays correct, the edges get cut. On mimir's 3440x1440 21:9 panels this kills
# the pillarboxing on 16:9 sources and the baked-in letterbox bars that most
# films ship inside a 16:9 container.
#
# Trade-off: for genuinely full-frame 16:9 content (most TV) this crops roughly
# 25% off the top and bottom. Press Z during playback to cycle Plex's own aspect
# modes — a runtime change overrides this file for that playback only.
#
# Use absolute values only. Per mpv.conf.md, relative directives (e.g. vf-add=)
# compound with each playback; absolute ones (vf=, panscan=) do not.
panscan=1.0
