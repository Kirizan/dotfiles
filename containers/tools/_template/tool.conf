# tools/__TOOL__/tool.conf — the manifest for one kc tool.
#
# `kc build` turns every TOOL_* value into an org.kirizan.kc.* image label, so the
# image is self-describing and `kc run` needs no per-tool code. Never hand-write
# labels in the Containerfile.
TOOL_NAME="__TOOL__"                # image: kc-__TOOL__, volume: kc-__TOOL__-state
TOOL_CMD="__TOOL__"                 # binary to exec (must match the Containerfile ENTRYPOINT)
TOOL_SHIMS="__TOOL__"               # host command names kc can shim, space-separated
TOOL_DESCRIPTION="One line."
TOOL_APK=""                         # Wolfi packages
TOOL_CONFIG_PATHS=""                # chezmoi target paths to bake, e.g. ".config/__TOOL__"
TOOL_TTY="auto"                     # auto | always | never
TOOL_PORTS=""                       # e.g. "23635" (published only with kc run --ports)
TOOL_ENV=""                         # extra env passed through from host, space-separated names
TOOL_NETWORK="default"              # default | host | none
