# tools/tmux/tool.conf — standalone tmux image. The toolbox already includes
# tmux through its shell layer, so this is NOT in toolbox/tools.list.
TOOL_NAME="tmux"
TOOL_CMD="tmux"
TOOL_SHIMS="tmux"
TOOL_DESCRIPTION="tmux with baked TPM plugins (sessions end with the container)"
TOOL_APK="tmux git bash fish fzf"
TOOL_CONFIG_PATHS=".tmux.conf"
TOOL_TTY="always"
TOOL_PORTS=""
TOOL_ENV=""
TOOL_NETWORK="default"
