# tools/nvim/tool.conf — see tools/_template/tool.conf for the field reference.
TOOL_NAME="nvim"
TOOL_CMD="nvim"
TOOL_SHIMS="nvim vim vi"
TOOL_DESCRIPTION="LazyVim-based Neovim with baked plugins, parsers and LSPs"
# build-base = gcc + make + glibc-dev (telescope-fzf-native, treesitter parsers).
# tree-sitter CLI and typst aren't in Wolfi; install.sh pins upstream binaries.
TOOL_APK="neovim git ripgrep fd fzf curl unzip build-base nodejs npm python-3 go lazygit"
TOOL_CONFIG_PATHS=".config/nvim .gitconfig .gitignore_global"
TOOL_TTY="always"
TOOL_PORTS="23635"
TOOL_ENV="OBSIDIAN_VAULT"
TOOL_NETWORK="default"
