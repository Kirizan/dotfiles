# The toolbox shell layer, defined like any other tool so it goes through the
# same kc-tool-install recipe. Not a standalone image (no Containerfile).
TOOL_NAME="shell"
TOOL_CMD="fish"
TOOL_SHIMS=""
TOOL_DESCRIPTION="fish + starship + tmux + CLI utilities"
TOOL_APK="fish starship direnv eza bat jq tree wget tmux chezmoi fzf ripgrep fd git openssh-client"
TOOL_CONFIG_PATHS=".config/fish .config/starship.toml .tmux.conf .gitconfig .gitignore_global"
TOOL_TTY="auto"
TOOL_PORTS=""
TOOL_ENV=""
TOOL_NETWORK="default"
